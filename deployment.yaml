apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-page
  template:
    metadata:
      labels:
        app: nginx-page
    spec:
      containers:
        - name: nginx-page
          image: 23120049/nginx-page:a8d011b9549eaf10e697fae831b2dbeca15a7625
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-page
spec:
  selector:
    app: nginx-page
  ports:
    - port: 80
      targetPort: 8080
