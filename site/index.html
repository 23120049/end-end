<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Release Information</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #e6edf7;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem;
        border: 1px solid #334155;
        border-radius: 1rem;
        background: #111827;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 25%);
      }

      h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); }
      p { color: #aab8cc; line-height: 1.6; }
      dl { margin: 1.5rem 0 0; }
      .item { padding: 1rem 0; border-top: 1px solid #273449; }
      dt { color: #8fa4c4; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      dd { margin: 0.35rem 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 1rem; }
      .status { color: #6ee7b7; }
    </style>
  </head>
  <body>
    <main>
      <p class="status">● Healthy release page</p>
      <h1>Nginx GitOps DevOps Platform</h1>
      <p>This page is intentionally small. Its release metadata makes each deployment easy to identify and verify.</p>

      <dl>
        <div class="item">
          <dt>Release version</dt>
          <dd>__RELEASE_VERSION__</dd>
        </div>
        <div class="item">
          <dt>Git commit SHA</dt>
          <dd>__GIT_SHA__</dd>
        </div>
        <div class="item">
          <dt>Image created at</dt>
          <dd>__IMAGE_CREATED_AT__</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
