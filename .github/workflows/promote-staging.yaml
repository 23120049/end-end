name: Promote release to staging

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          path: release

      - name: Resolve release commit
        id: release
        shell: bash
        run: |
          release_sha="$(git -C release rev-parse HEAD)"
          git -C release fetch origin main
          if ! git -C release merge-base --is-ancestor "$release_sha" origin/main; then
            echo "The release commit is not on main"
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out GitOps configuration
        uses: actions/checkout@v6
        with:
          ref: main
          path: config

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify release image exists
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/nginx-page:${{ steps.release.outputs.sha }}
        run: docker buildx imagetools inspect "$IMAGE" >/dev/null

      - name: Update staging image tag
        shell: bash
        working-directory: config
        run: |
          git pull --rebase origin main
          sed -i -E 's|^  tag:.*$|  tag: "${{ steps.release.outputs.sha }}"|' Helm/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Helm/values-staging.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(gitops): promote ${{ github.event.release.tag_name }} to staging"
          git push origin HEAD:main
