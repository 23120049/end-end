name: Deploy preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: preview-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request revision
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR number must contain digits only"
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "PR $PR_NUMBER is not open"
            exit 1
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Preview deployments from forked PRs are not supported"
            exit 1
          fi

          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${head_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check out preview source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: source

      - name: Check out GitOps configuration
        uses: actions/checkout@v6
        with:
          ref: main
          path: config

      - name: Validate Helm chart
        run: |
          helm lint ./source/Helm
          helm template nginx-page ./source/Helm --namespace preview-pr-${{ inputs.pr_number }}

      - name: Set image build metadata
        id: metadata
        shell: bash
        run: |
          echo "image_created_at=$(git -C source show -s --format=%cI '${{ steps.pr.outputs.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check whether the SHA image exists
        id: image
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/nginx-page:${{ steps.pr.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push preview image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./source
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/nginx-page:${{ steps.pr.outputs.sha }}
          build-args: |
            RELEASE_VERSION=pr-${{ inputs.pr_number }}-${{ steps.pr.outputs.short_sha }}
            GIT_SHA=${{ steps.pr.outputs.sha }}
            IMAGE_CREATED_AT=${{ steps.metadata.outputs.image_created_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update preview GitOps values
        shell: bash
        working-directory: config
        run: |
          git pull --rebase origin main
          mkdir -p Helm/previews
          cp Helm/values.yaml "Helm/previews/pr-${{ inputs.pr_number }}.yaml"
          sed -i -E 's|^  tag:.*$|  tag: "${{ steps.pr.outputs.sha }}"|' "Helm/previews/pr-${{ inputs.pr_number }}.yaml"
          sed -i -E '/^namespace:$/,/^[^ ]/ s|^  create: false$|  create: true|' "Helm/previews/pr-${{ inputs.pr_number }}.yaml"
          printf '\npreview:\n  prNumber: "%s"\n' "${{ inputs.pr_number }}" >> "Helm/previews/pr-${{ inputs.pr_number }}.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Helm/previews/pr-${{ inputs.pr_number }}.yaml"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(gitops): deploy preview for PR ${{ inputs.pr_number }}"
          git push origin HEAD:main
