name: Validate and publish

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "nginx/**"
      - "Helm/**"
      - "Dockerfile"
      - "api/**"
      - ".dockerignore"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "nginx/**"
      - "Dockerfile"
      - "api/**"
      - ".dockerignore"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set image build metadata
        id: metadata
        shell: bash
        run: |
          echo "release_version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_created_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build web image
        run: |
          docker build -t nginx-page:ci --build-arg RELEASE_VERSION="${{ steps.metadata.outputs.release_version }}" --build-arg GIT_SHA="$GITHUB_SHA" --build-arg IMAGE_CREATED_AT="${{ steps.metadata.outputs.image_created_at }}" .

      - name: Build API image
        run: docker build -f api/Dockerfile -t release-api:ci .

      - name: Install and test API
        working-directory: api
        run: |
          npm ci
          npm test

      - name: Lint Helm chart
        run: |
          helm lint ./Helm -f Helm/values-dev.yaml
          helm lint ./Helm -f Helm/values-staging.yaml

      - name: Smoke-test web image
        run: |
          docker run -d --name nginx-page-ci -p 127.0.0.1:8080:8080 nginx-page:ci
          trap 'docker rm -f nginx-page-ci' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/health)" = ok
          curl -fsS http://127.0.0.1:8080/ | grep -F "$GITHUB_SHA"

      - name: Smoke-test API image
        run: |
          docker run -d --name release-api-ci -p 127.0.0.1:3000:3000 release-api:ci
          trap 'docker rm -f release-api-ci' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:3000/api/health)" = '{"status":"ok"}'

      - name: Save tested images for publication
        if: github.event_name == 'push'
        run: docker save -o /tmp/images.tar nginx-page:ci release-api:ci

      - name: Upload artifacts 
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: /tmp/images.tar
          compression-level: 0
          retention-days: 1

  publish-main:
    name: Publish main and update dev
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          name: container-images
          path: /tmp

      - name: Load tested images
        run: docker load -i /tmp/images.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check whether the SHA image exists
        id: image
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/nginx-page:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tested web image to Dockerhub 
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/nginx-page:${{ github.sha }}
        run: |
          docker tag nginx-page:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Check whether API SHA image exists
        id: api-image
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/release-api:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tested API image to Dockerhub 
        if: steps.api-image.outputs.exists != 'true'
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/release-api:${{ github.sha }}
        run: |
          docker tag release-api:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Update development web and API image tags
        shell: bash
        run: |
          git pull --rebase origin main
          sed -i -E 's|^  tag:.*$|  tag: "${{ github.sha }}"|' Helm/values-dev.yaml
          sed -i -E 's|^    tag:.*$|    tag: "${{ github.sha }}"|' Helm/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Helm/values-dev.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${{ github.sha }} to dev [skip ci]"
          git push origin HEAD:main
