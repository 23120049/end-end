apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-page.fullname" . }}
  labels:
    {{- include "nginx-page.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "nginx-page.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: {{ .Values.service.type }}
