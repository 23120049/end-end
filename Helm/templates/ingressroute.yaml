{{- if .Values.ingressRoute.enabled }}
{{- $fullName := include "nginx-page.fullname" . }}
{{- $servicePort := .Values.service.port }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "nginx-page.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    {{- range .Values.ingressRoute.hosts }}
    - kind: Rule
      match: {{ printf "Host(`%s`) && PathPrefix(`/`)" .host | quote }}
      services:
        - kind: Service
          name: {{ $fullName }}
          port: {{ $servicePort }}
          nativeLB: true
    {{- end }}
{{- end }}
