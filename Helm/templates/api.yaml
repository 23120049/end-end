{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-api
  template:
    metadata:
      labels:
        app: release-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: RELEASE_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: GIT_SHA
              value: {{ .Values.api.image.tag | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: release-api
spec:
  type: ClusterIP
  selector:
    app: release-api
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
