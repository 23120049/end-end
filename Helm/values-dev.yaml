replicaCount: 2

image:
  repository: 23120049/nginx-page
  pullPolicy: IfNotPresent
  tag: "b8529cf5b15d2bf57dbabffbb548688a3862f919"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace:
  create: false

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingressRoute:
  enabled: true
  entryPoints: [web]
  hosts:
    - host: nginx-page.local

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

api:
  enabled: true
  image:
    repository: 23120049/release-api
    tag: "b8529cf5b15d2bf57dbabffbb548688a3862f919"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
