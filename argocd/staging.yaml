apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-page-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/23120049/end-end.git
    targetRevision: main
    path: Helm
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
